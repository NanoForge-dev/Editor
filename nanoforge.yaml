replicaCount: 1
name: editor
image:
  repository: ghcr.io/nanoforge-dev/editor
  tag: latest
imagePullSecret: 'nanoforge-docker-token'
routes:
  - port: 3000
    match: 'Host(`editor.nanoforge.eu`)'
config:
  - name: api_url
    value: 'https://api.nanoforge.eu'
  - name: node_env
    value: 'production'
  - name: nf_cli_path
    value: 'nf'
  - name: public_pm_url
    value: 'https://projects.nanoforge.eu'
  - name: public_docs_url
    value: 'https://docs.nanoforge.eu'
  - name: public_landing_url
    value: 'https://nanoforge.eu'
  - name: fs_root
    value: projects
  - name: archive_root
    value: archives
env:
  - name: API_KEY
    valueFrom:
      secretKeyRef:
        name: editor-key
        key: api-key
