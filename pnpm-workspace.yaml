packages:
  - apps/*
  - packages/*
  - plugins/*
  - tooling/*

allowBuilds:
  bun: true
  esbuild: true

# Patched versions of transitive deps whose parents pin a vulnerable one (pnpm audit, Editor #262):
# monaco-editor pins dompurify, eslint-plugin-format pins oxfmt, which pins tinypool.
overrides:
  dompurify: ^3.4.17
  tinypool: ^2.1.2

catalogs:
  build:
    tsdown: ^0.22.14
    turbo: ^2.10.12
    typescript: ^6.0.3
    unrun: ^0.3.0
  ci:
    '@commitlint/cli': ^21.2.4
    '@commitlint/config-conventional': ^21.2.0
    '@favware/cliff-jumper': ^6.1.0
    husky: ^9.1.7
    lint-staged: ^17.0.8
  components:
    '@lucide/svelte': ^1.48.0
    '@fontsource/instrument-sans': ^5.3.0
    '@fontsource/jetbrains-mono': ^5.3.0
    bits-ui: ^2.19.3
    monaco-editor: ^0.55.1
  config:
    '@nanoforge-dev/config': ^2.3.0
  core:
    '@sveltejs/kit': ^2.65.0
    '@sveltejs/vite-plugin-svelte': ^7.1.2
    '@types/bun': ^1.4.4
    '@types/node': ^26.4.0
    svelte: ^5.57.3
    svelte-check: ^4.6.0
    svelte2tsx: ^0.7.61
    vite: ^8.3.8
  adapter:
    '@sveltejs/adapter-static': ^3.0.10
  libs:
    '@jridgewell/trace-mapping': ^0.3.31
    '@nanoforge-dev/registry': ^3.0.1
    fflate: ^0.8.2
    ignore: ^7.0.14
    semver: ^7.7.3
    '@types/semver': ^7.7.1
    zod: ^4.6.7
  lint:
    '@nanoforge-dev/utils-eslint-config': ^1.0.2
    '@nanoforge-dev/utils-prettier-config': ^1.0.2
    '@trivago/prettier-plugin-sort-imports': ^6.0.2
    eslint: ^10.6.0
    eslint-plugin-svelte: ^3.20.0
    globals: ^17.7.0
    knip: ^6.38.0
    prettier: ^3.9.4
    prettier-plugin-svelte: ^4.1.1
    typescript-eslint: ^8.62.1
  code:
    ts-morph: ^28.0.0
  tooling:
    es-module-lexer: ^2.0.0
  server:
    chokidar: ^4.0.3
    prettier: ^3.9.4
    yaml: ^2.9.1
  test:
    '@playwright/test': ^1.61.1
    '@vitest/browser-playwright': ^4.1.9
    '@vitest/coverage-v8': ^4.1.9
    playwright: ^1.63.0
    vitest: ^4.1.9
    vitest-browser-svelte: ^2.2.0

minimumReleaseAgeExclude:
  - '@nanoforge-dev/registry@3.0.1'
