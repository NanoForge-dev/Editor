name: Alpha Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Perform a dry run?
        type: boolean
        default: false

env:
  PUBLIC_MODE: ${{ vars.PUBLIC_MODE }}
  PUBLIC_PM_URL: ${{ vars.PUBLIC_PM_URL }}
  PUBLIC_DOCS_URL: ${{ vars.PUBLIC_DOCS_URL }}
  PUBLIC_LANDING_URL: ${{ vars.PUBLIC_LANDING_URL }}

permissions:
  contents: write
  id-token: write

jobs:
  alpha-release:
    name: Alpha release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'NanoForge-dev' && github.ref_name != 'main' && github.ref_name != 'master'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Release alpha
        uses: ./node_modules/@nanoforge-dev/actions/actions/release-dev
        with:
          package: '@nanoforge-dev/editor'
          tag: alpha
          dry: ${{ inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
