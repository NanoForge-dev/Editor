name: Alpha Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: The package to release (the SDK and the vite-plugin are versioned on their own)
        type: choice
        required: true
        default: '@nanoforge-dev/editor'
        options:
          - '@nanoforge-dev/editor'
          - '@nanoforge-dev/editor-sdk'
          - '@nanoforge-dev/editor-vite-plugin'
      dry_run:
        description: Perform a dry run?
        type: boolean
        default: false

env:
  PUBLIC_PM_URL: ${{ vars.PUBLIC_PM_URL }}
  PUBLIC_DOCS_URL: ${{ vars.PUBLIC_DOCS_URL }}
  PUBLIC_LANDING_URL: ${{ vars.PUBLIC_LANDING_URL }}

permissions:
  contents: write
  id-token: write

jobs:
  alpha-release:
    name: Alpha release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'NanoForge-dev' && github.ref_name != 'main' && github.ref_name != 'master'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare
        uses: ./.github/actions/prepare
        env:
          NODE_ENV: development
          PUBLIC_MODE: OFFLINE

      - name: Release alpha
        uses: ./node_modules/@nanoforge-dev/actions/actions/release-dev
        with:
          package: ${{ inputs.package }}
          tag: alpha
          dry: ${{ inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
