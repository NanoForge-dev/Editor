name: Alpha Release
# The alpha is <next version>-alpha.<branch>.<n>: the exact number is in the job summary.
run-name: Alpha release ${{ inputs.packages }} on ${{ github.ref_name }}${{ inputs.dry-run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      packages:
        description: The package to release (the SDK and the vite-plugin are versioned on their own)
        type: choice
        default: '@nanoforge-dev/editor'
        options:
          - '@nanoforge-dev/editor'
          - '@nanoforge-dev/editor-sdk'
          - '@nanoforge-dev/editor-vite-plugin'
      dry-run:
        description: Perform a dry run?
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  alpha:
    name: Alpha release
    uses: nanoforge-dev/actions/.github/workflows/alpha-release.yml@v3
    with:
      packages: ${{ inputs.packages }}
      dry-run: ${{ inputs.dry-run }}
      prepare-env: |
        NODE_ENV=development
        PUBLIC_MODE=OFFLINE
        PUBLIC_PM_URL=${{ vars.PUBLIC_PM_URL }}
        PUBLIC_DOCS_URL=${{ vars.PUBLIC_DOCS_URL }}
        PUBLIC_LANDING_URL=${{ vars.PUBLIC_LANDING_URL }}
    secrets:
      NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
