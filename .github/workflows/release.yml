name: Release
# The release PR title holds the version (commitFormat); any other merged PR publishes the betas of the packages it changed.
run-name: >-
  ${{ !github.event.pull_request.merged && format('Closed without merge: {0}', github.event.pull_request.title)
  || startsWith(github.head_ref, 'releases/') && format('Release: {0}', github.event.pull_request.title)
  || format('Beta release of {0}', github.event.pull_request.merge_commit_sha) }}

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  # A releases/editor@… PR releases the editor (then its image, and the docs in this job); a releases/packages/…
  # PR releases the SDK or the vite-plugin, versioned on their own.
  release:
    name: Release
    uses: nanoforge-dev/actions/.github/workflows/release.yml@v3
    with:
      prepare-env: |
        NODE_ENV=development
        PUBLIC_MODE=OFFLINE
        PUBLIC_PM_URL=${{ vars.PUBLIC_PM_URL }}
        PUBLIC_DOCS_URL=${{ vars.PUBLIC_DOCS_URL }}
        PUBLIC_LANDING_URL=${{ vars.PUBLIC_LANDING_URL }}
    secrets:
      NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
      # The config has docs: an editor release syncs docs/docs to the editor category of NanoForge-dev/docs.
      NANOFORGE_DOCS_PRIVATE_KEY: ${{ secrets.NANOFORGE_DOCS_PRIVATE_KEY }}

  # No betaOnMerge in the config: the shared beta job would publish all three packages on every merge.
  # This one publishes a package's beta only when the PR changed its code.
  beta:
    name: Beta release (${{ matrix.package }})
    runs-on: ubuntu-latest
    if: github.repository_owner == 'NanoForge-dev' && github.event.pull_request.merged == true && !startsWith(github.head_ref, 'releases/')
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: '@nanoforge-dev/editor'
            paths: '^(apps|packages|plugins|tooling)/|^(pnpm-lock|pnpm-workspace)\.yaml$|^turbo\.json$'
          # The SDK bundles the editor packages it re-exports.
          - package: '@nanoforge-dev/editor-sdk'
            paths: '^packages/|^(pnpm-lock|pnpm-workspace)\.yaml$'
          - package: '@nanoforge-dev/editor-vite-plugin'
            paths: '^tooling/vite-plugin/|^packages/kernel/|^(pnpm-lock|pnpm-workspace)\.yaml$'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2

      - name: Check for code changes
        id: changes
        shell: bash
        env:
          PATHS: ${{ matrix.paths }}
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qE "$PATHS"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Export the prepare env
        if: steps.changes.outputs.code == 'true'
        uses: nanoforge-dev/actions/export-env@v3
        with:
          env: |
            NODE_ENV=development
            PUBLIC_MODE=OFFLINE
            PUBLIC_PM_URL=${{ vars.PUBLIC_PM_URL }}
            PUBLIC_DOCS_URL=${{ vars.PUBLIC_DOCS_URL }}
            PUBLIC_LANDING_URL=${{ vars.PUBLIC_LANDING_URL }}

      - name: Prepare the repository
        if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/prepare

      - name: Publish the beta on npm
        if: steps.changes.outputs.code == 'true'
        uses: nanoforge-dev/actions/prerelease@v3
        with:
          channel: beta
          packages: ${{ matrix.package }}
          npm-token: ${{ secrets.NPM_PUBLISH_TOKEN }}

  docker:
    name: Push image
    runs-on: ubuntu-latest
    needs: [release]
    # An SDK or vite-plugin release also sets released: only the editor's pushes the image.
    if: needs.release.outputs.released == 'true' && startsWith(github.head_ref, 'releases/editor@')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      # A one-hour token of the NanoForge deploy GitHub App, for NanoForge-dev/cloud-iac only.
      - name: Get a cloud-iac token from the NanoForge deploy app
        id: bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.NANOFORGE_DEPLOY_CLIENT_ID }}
          private-key: ${{ secrets.NANOFORGE_DEPLOY_PRIVATE_KEY }}
          owner: NanoForge-dev
          repositories: cloud-iac
          permission-contents: write

      - name: Build and push the image, then update cloud-iac
        uses: nanoforge-dev/actions/docker-release@v3
        with:
          image: nanoforge-dev/editor
          version: ${{ needs.release.outputs.version }}
          values-file: kubernetes/nanoforge/editor-override.yaml
          cloud-iac-token: ${{ steps.bot.outputs.token }}
          build-args: |
            PUBLIC_MODE=ONLINE
            PUBLIC_PM_URL=${{ vars.PUBLIC_PM_URL }}
            PUBLIC_DOCS_URL=${{ vars.PUBLIC_DOCS_URL }}
            PUBLIC_LANDING_URL=${{ vars.PUBLIC_LANDING_URL }}
            FS_ROOT=projects
            ARCHIVE_ROOT=archives
