name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

env:
  REGISTRY: ghcr.io
  ORG_NAME: ${{ github.repository_owner }}
  IMAGE_NAME: ${{ github.event.repository.name }}
  CONFIG_FILE: kubernetes/nanoforge/editor-override.yaml

  PUBLIC_PM_URL: ${{ vars.PUBLIC_PM_URL }}
  PUBLIC_DOCS_URL: ${{ vars.PUBLIC_DOCS_URL }}
  PUBLIC_LANDING_URL: ${{ vars.PUBLIC_LANDING_URL }}

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'NanoForge-dev' && github.event.pull_request.merged == true && startsWith(github.head_ref, 'releases/editor@')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare
        uses: ./.github/actions/prepare
        env:
          NODE_ENV: development
          PUBLIC_MODE: OFFLINE

      - name: Release packages
        uses: ./node_modules/@nanoforge-dev/actions/actions/release-packages
        with:
          packages: '@nanoforge-dev/editor'
          tag-format: '{version}'
          latest: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The SDK and the vite-plugin are versioned on their own (releases/editor-sdk@1.2.0), tagged
  # @nanoforge-dev/<name>@<version>. Only the editor's release pushes the image and the docs.
  release-single-package:
    name: Release single package
    runs-on: ubuntu-latest
    if: github.repository_owner == 'NanoForge-dev' && github.event.pull_request.merged == true && startsWith(github.head_ref, 'releases/') && !startsWith(github.head_ref, 'releases/editor@')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare
        uses: ./.github/actions/prepare
        env:
          NODE_ENV: development
          PUBLIC_MODE: OFFLINE

      - name: Get package name
        id: package
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          name="${BRANCH#releases/}"
          echo "name=@nanoforge-dev/${name%%@*}" >> "$GITHUB_OUTPUT"

      - name: Release package
        uses: ./node_modules/@nanoforge-dev/actions/actions/release-packages
        with:
          packages: ${{ steps.package.outputs.name }}
          latest: false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  beta-release:
    name: Beta release (${{ matrix.package }})
    runs-on: ubuntu-latest
    if: github.repository_owner == 'NanoForge-dev' && github.event.pull_request.merged == true && !startsWith(github.head_ref, 'releases/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: '@nanoforge-dev/editor'
            paths: '^(apps|packages|plugins|tooling)/|^(pnpm-lock|pnpm-workspace)\.yaml$|^turbo\.json$'
          # The SDK bundles the editor packages it re-exports.
          - package: '@nanoforge-dev/editor-sdk'
            paths: '^packages/|^(pnpm-lock|pnpm-workspace)\.yaml$'
          - package: '@nanoforge-dev/editor-vite-plugin'
            paths: '^tooling/vite-plugin/|^packages/kernel/|^(pnpm-lock|pnpm-workspace)\.yaml$'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A pull request that changes none of the package's code (docs, CI, issue forms) publishes no beta of it.
      - name: Check for code changes
        id: changes
        shell: bash
        env:
          PATHS: ${{ matrix.paths }}
        run: |
          if git diff --name-only "${{ github.event.pull_request.merge_commit_sha }}^" "${{ github.event.pull_request.merge_commit_sha }}" \
            | grep -qE "$PATHS"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare
        if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/prepare
        env:
          NODE_ENV: development
          PUBLIC_MODE: OFFLINE

      - name: Release beta
        if: steps.changes.outputs.code == 'true'
        uses: ./node_modules/@nanoforge-dev/actions/actions/release-dev
        with:
          package: ${{ matrix.package }}
          tag: beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  push-image:
    name: Push image
    runs-on: ubuntu-latest
    if: github.repository_owner == 'NanoForge-dev'
    needs: [release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Push Docker image
        uses: ./.github/actions/docker-push
        with:
          target: editor
          registry: ${{ env.REGISTRY }}
          image: ${{ env.ORG_NAME }}/${{ env.IMAGE_NAME }}
          token: ${{ secrets.TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config-file: ${{ env.CONFIG_FILE }}
          args: |
            PUBLIC_MODE
            PUBLIC_PM_URL
            PUBLIC_DOCS_URL
            PUBLIC_LANDING_URL
            FS_ROOT
            ARCHIVE_ROOT
        env:
          NODE_ENV: production
          PUBLIC_MODE: ONLINE
          FS_ROOT: projects
          ARCHIVE_ROOT: archives

  publish-docs:
    name: Publish docs
    runs-on: ubuntu-latest
    if: github.repository_owner == 'NanoForge-dev'
    needs: [push-image]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout docs repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          path: docs-dist
          repository: nanoforge-dev/docs
          token: ${{ secrets.TOKEN }}

      - name: Prepare
        uses: ./.github/actions/prepare
        env:
          PUBLIC_MODE: OFFLINE

      - name: Publish docs
        uses: ./node_modules/@nanoforge-dev/actions/actions/synchronize-docs
        with:
          repository: editor
          category: editor
