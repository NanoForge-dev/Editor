name: Tests

on:
  pull_request:
    branches:
      - main
  # Pushes to main fill the caches that pull requests restore.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    uses: nanoforge-dev/actions/.github/workflows/tests.yml@v3
    with:
      # Lint: Prettier, the workspace standards (scripts/check-workspaces.mjs), knip and ESLint.
      style-scripts: '["lint", "typecheck"]'
      # The unit tests need Playwright browsers and CHROME, which the shared unit job can't set: see unit below.
      unit-script: ''
      # No audit job yet: the lockfile has high and critical advisories to fix first.
      audit-level: ''
      prepare-env: |
        PUBLIC_MODE=${{ vars.PUBLIC_MODE }}
        PUBLIC_PM_URL=${{ vars.PUBLIC_PM_URL }}
        PUBLIC_DOCS_URL=${{ vars.PUBLIC_DOCS_URL }}
        PUBLIC_LANDING_URL=${{ vars.PUBLIC_LANDING_URL }}

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      PUBLIC_MODE: ${{ vars.PUBLIC_MODE }}
      PUBLIC_PM_URL: ${{ vars.PUBLIC_PM_URL }}
      PUBLIC_DOCS_URL: ${{ vars.PUBLIC_DOCS_URL }}
      PUBLIC_LANDING_URL: ${{ vars.PUBLIC_LANDING_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Restored before prepare, so its build skips the untouched packages.
      - name: Cache the turbo outputs
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-unit-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-unit-

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Install browsers
        uses: ./.github/actions/playwright-install
        with:
          browsers: chromium firefox

      # Coverage on Chromium (v8 coverage reads Chromium only), failing under each
      # workspace's floor (coverage-floors.json). The kit's component tests use the runner's
      # Chrome. test:coverage caches coverage/**, so a turbo hit restores the reports.
      - name: Run tests with coverage
        run: pnpm test:coverage
        env:
          CHROME: /usr/bin/google-chrome

      - name: Run the browser cache tests on Firefox
        run: pnpm --filter @nanoforge-dev/editor-project exec vitest run --config vitest.config.ts --project browser
        env:
          BROWSERS: firefox

      - name: Report the coverage
        if: always()
        uses: nanoforge-dev/actions/coverage-report@v3
        with:
          files: '*/*/coverage/lcov.info'

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            */*/coverage/lcov.info
            */*/coverage/coverage-summary.json
          if-no-files-found: ignore
