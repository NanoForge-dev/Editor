name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLIC_MODE: ${{ vars.PUBLIC_MODE }}
  PUBLIC_PM_URL: ${{ vars.PUBLIC_PM_URL }}
  PUBLIC_DOCS_URL: ${{ vars.PUBLIC_DOCS_URL }}
  PUBLIC_LANDING_URL: ${{ vars.PUBLIC_LANDING_URL }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Run linter
        run: pnpm lint

      - name: Run type checks
        run: pnpm typecheck

      - name: Install browsers for component and cache tests
        run: pnpm --filter @nanoforge-dev/editor-ui exec playwright install --with-deps chromium firefox webkit

      - name: Run tests
        run: pnpm test:unit
        env:
          BROWSERS: chromium,firefox,webkit
