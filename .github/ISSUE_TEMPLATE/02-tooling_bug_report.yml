name: Bug report on tooling
description: Report an issue with Nanoforge Editor tooling.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for filing an issue! If you are here to ask a question, don't hesitate to open a discussion instead: https://github.com/NanoForge-dev/Editor/discussions.

        This issue form is for Nanoforge Editor tooling.
  - type: dropdown
    id: package
    attributes:
      label: Which tooling is this bug report for?
      options:
        - example-plugin
        - vite-plugin
        - other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Issue description
      description: Describe the issue in as much detail as possible.
      placeholder: |
        Steps to reproduce with below code sample:
        1. Do thing
        2. Build your plugin
        3. Observe behavior
        4. See error logs below
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: List necessary versions here. This includes your package version, runtime version, operating system etc.
      placeholder: |
        - @nanoforge-dev/editor-vite-plugin 1.0.0 (`npm ls @nanoforge-dev/editor-vite-plugin`)
        - Node.js 26 (`node --version`)
        - TypeScript 6.0.3 (`npm ls typescript` if you use it)
        - macOS Ventura 13.3.1
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Issue priority
      description: Please be realistic. If you need to elaborate on your reasoning, please use the issue description field above.
      options:
        - Low (slightly annoying)
        - Medium (should be fixed soon)
        - High (immediate attention needed)
    validations:
      required: true
