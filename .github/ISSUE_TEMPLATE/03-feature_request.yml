name: Feature request
description: Request a new feature
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting an idea !
  - type: dropdown
    id: application_or_package
    attributes:
      label: Which package or tooling is this feature request for?
      options:
        - editor
        - code
        - history
        - kernel
        - layout
        - meta
        - project
        - protocol
        - registry
        - rpc
        - runtime
        - sdk
        - server-core
        - settings
        - ui
        - code-editor
        - command-palette
        - console
        - ecs
        - file-manager
        - git
        - history-panel
        - inspectors
        - packages
        - scene
        - settings-ui
        - viewport
        - example-plugin
        - vite-plugin
        - other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Feature
      description: A clear and concise description of what the problem is, or what feature you want to be implemented.
      placeholder: I'm always frustrated when..., A good addition would be...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Ideal solution or implementation
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative solutions or implementations
      description: A clear and concise description of any alternative solutions or features you have considered.
  - type: textarea
    id: additional_context
    attributes:
      label: Other context
      description: Any other context, screenshots, or file uploads that help us understand your feature request.
