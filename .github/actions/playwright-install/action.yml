name: 'Install Playwright browsers'
description: 'Install Playwright browsers, cached by Playwright version'
inputs:
  browsers:
    description: 'Browsers to install, separated by spaces'
    default: 'chromium'
  filter:
    description: 'Workspace whose Playwright installs them'
    default: '@nanoforge-dev/editor'
runs:
  using: 'composite'
  steps:
    - name: Read the Playwright version
      id: version
      shell: bash
      run: echo "version=$(pnpm --filter '${{ inputs.filter }}' exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v5
      id: cache
      name: Cache browsers
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.version.outputs.version }}-${{ inputs.browsers }}

    - name: Install browsers
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm --filter '${{ inputs.filter }}' exec playwright install --with-deps ${{ inputs.browsers }}

    # The browsers come from the cache; their system libraries do not.
    - name: Install system libraries
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm --filter '${{ inputs.filter }}' exec playwright install-deps ${{ inputs.browsers }}
