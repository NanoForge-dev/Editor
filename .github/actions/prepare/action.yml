name: prepare
description: Prepare action
inputs:
  node-install:
    description: Install node
    default: 'true'
  pnpm-install:
    description: Install pnpm depedencies
    default: 'true'
  build:
    description: Build packages
    default: 'true'
runs:
  using: composite
  steps:
    - if: inputs.node-install == 'true'
      name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 26
        package-manager-cache: false
        registry-url: https://registry.npmjs.org

    # The editor server build and the game runtime (tests included) run on Bun.
    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.14

    - if: inputs.pnpm-install == 'true'
      name: Install dependencies
      uses: ./.github/actions/pnpm-install

    # Turbo's local cache, one per job (jobs don't overwrite each other) and per month (a new
    # month starts empty, so the cache doesn't only grow), kept between runs of a branch.
    - name: Turbo cache month
      id: turbo-month
      shell: bash
      run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

    - name: Cache turbo
      uses: actions/cache@v5
      with:
        path: .turbo/cache
        key: ${{ runner.os }}-turbo-${{ github.job }}-${{ steps.turbo-month.outputs.month }}-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ github.job }}-${{ steps.turbo-month.outputs.month }}-${{ github.ref_name }}-
          ${{ runner.os }}-turbo-${{ github.job }}-${{ steps.turbo-month.outputs.month }}-

    - if: inputs.build == 'true'
      name: Build packages
      shell: bash
      run: pnpm run build
