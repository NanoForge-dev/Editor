name: prepare
description: Installs Node.js, pnpm, Bun and the dependencies, then builds the packages
runs:
  using: composite
  steps:
    - name: Set up Node.js, pnpm and the dependencies
      uses: nanoforge-dev/actions/setup@v3

    # The editor server build and the game runtime (tests included) run on Bun.
    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.14

    - name: Build the packages
      shell: bash
      run: pnpm run build
